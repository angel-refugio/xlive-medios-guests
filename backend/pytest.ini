[pytest]
pythonpath = .
testpaths = tests
filterwarnings =
    # Aviso conocido de Starlette por usar httpx en TestClient (pendiente de la Fase 8, ver docs/PHASE2_PLAN.md).
    # Solo se oculta este mensaje; cualquier otro aviso sigue apareciendo.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
